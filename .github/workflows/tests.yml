name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install . -r examples/requirements-demo.txt
      - run: python -m unittest discover -s tests -v
      - run: python examples/digits_demo.py demo
      - run: unlearning-audit validate demo/losses.csv --manifest demo/manifest.json
      - run: unlearning-audit report demo/metrics.json --output demo/report.html
      - run: unlearning-audit report demo/metrics.json --format csv --output demo/summary.csv
      - run: unlearning-audit report demo/metrics.json --format roc-csv --output demo/roc.csv
      - run: unlearning-audit verify demo/metrics.json demo/losses.csv --manifest demo/manifest.json
      - run: python examples/digits_demo.py demo-43 --training-seed 43
      - run: unlearning-audit study demo/metrics.json demo-43/metrics.json --format html --output study.html
      - run: python examples/ridge_control.py ridge-demo
      - run: unlearning-audit verify ridge-demo/exact/metrics.json ridge-demo/exact/losses.csv --manifest ridge-demo/exact/manifest.json
      - run: python -c "import json; exact, unchanged = json.load(open('ridge-demo/controls.json'))['controls']; assert exact['max_coefficient_gap'] < 1e-12; assert exact['auc']['candidate'] == unchanged['auc']['candidate']; assert exact['candidate_loss_gaps']['holdout'] < 1e-12; assert unchanged['candidate_loss_gaps']['holdout'] > 1"
      - run: python examples/ridge_benchmark.py ridge-benchmark --timing-rows 2000
      - run: python examples/plot_ridge_benchmark.py ridge-benchmark/benchmark.json ridge-benchmark/timing.svg
      - run: python -c "import json; r = json.load(open('ridge-benchmark/benchmark.json')); assert len(r['stress']) == 108; assert len(r['digits']) == 24; assert len(r['timing']) == 12; assert any(c['status'] == 'outside_tolerance' for c in r['stress']); assert all(c['status'] == 'within_tolerance' for c in r['digits'])"
      - run: python examples/sequential_benchmark.py sequential --quick
